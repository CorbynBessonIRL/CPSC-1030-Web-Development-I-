<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 10B - Music Survey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        fieldset {
            background-color: #ffffff;
            border: 2px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            max-width: 400px;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Music Survey Form</h1>
    <form action="https://webdevbasics.net/scripts/demo.php" method="post">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email"><br><br>

        <label for="comments">Why do you like music?</label><br>
        <textarea name="comments" id="comments" rows="3" cols="60"></textarea><br><br>

        <fieldset>
            <legend>Favorite Genre</legend>
            <input type="radio" name="genre" value="rock"> Rock<br>
            <input type="radio" name="genre" value="pop"> Pop<br>
            <input type="radio" name="genre" value="classical"> Classical<br>
        </fieldset>

        <fieldset>
            <legend>Preferred Devices</legend>
            <input type="checkbox" name="device" value="phone"> Phone<br>
            <input type="checkbox" name="device" value="computer"> Computer<br>
            <input type="checkbox" name="device" value="speaker"> Smart Speaker<br>
        </fieldset>

        <label for="platform">Favorite Streaming Platform:</label>
        <select name="platform" id="platform" size="3">
            <option value="spotify">Spotify</option>
            <option value="apple">Apple Music</option>
            <option value="youtube">YouTube Music</option>
            <option value="amazon">Amazon Music</option>
        </select><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

    <div class="footer">
        <p>Created by: Kei Takuwa</p>
        <p>Email:ktakuwa00@mylangara.ca</p>
    </div>
</body>
</html>
