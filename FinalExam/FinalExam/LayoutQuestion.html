    <title>Final Exam Layout Question Q2</title>
    <style>

      }

        height: 40px;

      }

      .box5 {
        border: 2px solid black;
        width: 90px;
        height: 80px;
        float: left;
      }

  <body>
    <h1>Layout Question</h1>

    <div class="box2">
      Box 2
      <div class="box1">
        Box 1
        <div class="box4">Box 4</div>

  </body>
